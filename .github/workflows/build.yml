# Builds AIKO for macOS (Apple Silicon and Intel), Linux and Windows.
# Push a tag like v2.9.0 to attach the installers to that GitHub release; run it by hand to just get artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # one Mac job builds both architectures: GitHub's Mac runners are scarce, and a second Mac job
          # can sit in the queue until it's cancelled
          - { os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin", bundles: "app,dmg", name: macos }
          - { os: ubuntu-24.04, targets: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage", name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies (webview, screen capture, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libssl-dev build-essential clang libclang-dev cmake file libfuse2 \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the 3D libraries (ui/vendor, optional VRM mode)
        shell: bash
        run: ./scripts/vendor.sh

      - name: Build and bundle
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            npx --yes @tauri-apps/cli@2 build --target "$t" --bundles ${{ matrix.bundles }}
          done

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          for t in ${{ matrix.targets }}; do
            find "src-tauri/target/$t/release/bundle" -maxdepth 2 \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: aiko-${{ matrix.name }}
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the 3D libraries
        shell: bash
        run: ./scripts/vendor.sh
      - name: Build
        shell: pwsh
        run: |
          cd src-tauri
          cargo build --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DBuildExe=$PWD\src-tauri\target\release\aiko.exe" installer\aiko.iss
      - uses: actions/upload-artifact@v4
        with:
          name: aiko-windows
          path: release/AIKO-Setup-*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AIKO-Setup-*.exe
          prerelease: true
