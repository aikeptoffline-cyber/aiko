[package]
name = "aiko"
version = "2.9.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] } # transparent window on macOS
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] } # tls: web tools use https
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] } # xcap's image lacks the JPEG encoder
base64 = "0.22"
# her voice: offline neural TTS, same on every platform (speech.rs)
sherpa-onnx = "2.0.3"
piper-phonemize = "1.6.1" # GPL-3.0: espeak-ng phonemes for Piper voices
tar = "0.4"
bzip2 = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
